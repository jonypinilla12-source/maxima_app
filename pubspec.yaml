name: maxima_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  mobile_scanner: ^5.2.3
  url_launcher: ^6.3.2
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1 
  pdf: ^3.11.1
  printing: ^5.13.2
  geolocator: ^13.0.1 
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  shared_preferences : ^2.2.1
  # <--- Lo agregas aquí abajo

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1  # <--- FALTABA ESTA LÍNEA AQUÍ

flutter:
  uses-material-design: true
  assets:                          # <--- Descomenté esto para que Flutter pueda leer la carpeta assets
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo_maxima.png" # Asegúrate de que el logo se llame exactamente así
  min_sdk_android: 21

  assets:
    - assets/logo.png